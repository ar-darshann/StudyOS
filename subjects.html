<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Subject | StudyOS</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar"><a href="dashboard.html" class="logo">Study<span>OS</span></a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="subjectui.html" class="active">Subjects</a><a href="#" class="disabled-link">Progress</a></div><div class="nav-actions"><button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><span id="themeIcon">☀</span></button><button class="profile-button" id="profileButton">—</button></div></nav>
<main class="container">
<a href="subjectui.html" class="back-link">← Subjects</a>
<header class="subject-page-header"><div><p class="eyebrow">SUBJECT</p><h1 id="subjectName">Loading...</h1><p class="welcome-text" id="subjectDescription">Loading...</p></div><div class="subject-main-icon" id="subjectIcon">•</div></header>
<section class="stats-grid subject-stats"><div class="stat-card"><span class="stat-label">Average score</span><strong id="subjectAverage">—</strong></div><div class="stat-card"><span class="stat-label">Topics</span><strong id="subjectTopics">—</strong></div><div class="stat-card"><span class="stat-label">Study time</span><strong id="subjectStudyTime">—</strong></div></section>
<section class="simple-section"><div class="section-heading-row"><div><p class="section-kicker">TOPICS</p><h2>Your topics</h2></div><button class="secondary-button" id="addTopicButton">+ Add topic</button></div><div id="subjectTopicsList" class="subject-topics-list"></div></section>
<section class="simple-section material-section"><div class="section-heading-row"><div><p class="section-kicker">MATERIAL</p><h2>Your study material</h2><p class="section-description">Keep videos, audio, PDFs, documents and other files with this subject.</p></div><label class="primary-button file-button">+ Add material<input id="materialInput" type="file" multiple hidden></label></div><div id="materialList" class="material-list"><p class="muted-message">No material added yet.</p></div></section>
</main>
<div class="modal hidden" id="topicModal" aria-hidden="true"><div class="modal-backdrop" data-close-topic></div><section class="modal-card"><div class="modal-header"><div><p class="section-kicker">NEW TOPIC</p><h2>Add a topic</h2></div><button class="modal-close" id="closeTopicModal">×</button></div><form id="topicForm"><label>Topic name<input id="topicNameInput" type="text" maxlength="80" placeholder="e.g. Chapter 3 — Depreciation" required></label><div class="form-actions"><button type="button" class="secondary-button" id="cancelTopicButton">Cancel</button><button class="primary-button" type="submit">Add topic</button></div></form></section></div>
<footer><p>StudyOS</p></footer>
<script src="data/storage.js"></script><script src="script.js"></script>
</body></html>
