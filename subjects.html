<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject | StudyOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Study<span>OS</span></a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="subjectui.html" class="active">Subjects</a>
            <a href="#" class="disabled-link">Progress</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span id="themeIcon">☀</span>
            </button>
            <button class="profile-button" aria-label="Profile">SD</button>
        </div>
    </nav>

    <main class="container">
        <a href="subjectui.html" class="back-link">← Subjects</a>

        <header class="subject-page-header">
            <div>
                <p class="eyebrow">SUBJECT</p>
                <h1 id="subjectName">Loading...</h1>
                <p class="welcome-text" id="subjectDescription">Loading...</p>
            </div>
            <div class="subject-main-icon" id="subjectIcon">•</div>
        </header>

        <section class="stats-grid subject-stats">
            <div class="stat-card">
                <span class="stat-label">Average score</span>
                <strong id="subjectAverage">—</strong>
            </div>
            <div class="stat-card">
                <span class="stat-label">Topics</span>
                <strong id="subjectTopics">—</strong>
            </div>
            <div class="stat-card">
                <span class="stat-label">Study time</span>
                <strong id="subjectStudyTime">—</strong>
            </div>
        </section>

        <section class="simple-section">
            <div class="section-heading-row">
                <div>
                    <p class="section-kicker">TOPICS</p>
                    <h2>Your topics</h2>
                </div>
            </div>
            <div id="subjectTopicsList" class="subject-topics-list"></div>
        </section>
    </main>

    <footer>
        <p>StudyOS</p>
    </footer>

    <script src="data/sample-data.js"></script>
    <script src="data/storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
