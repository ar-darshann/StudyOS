<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects | StudyOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Study<span>OS</span></a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="subjectui.html" class="active">Subjects</a>
            <a href="#" class="disabled-link">Progress</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span id="themeIcon">☀</span>
            </button>
            <button class="profile-button" aria-label="Profile">SD</button>
        </div>
    </nav>

    <main class="container">
        <header class="page-header subjects-header">
            <div>
                <p class="eyebrow">LEARNING</p>
                <h1>Your subjects.</h1>
                <p class="welcome-text">Create the subjects you actually study. StudyOS will build the rest around them.</p>
            </div>
            <button id="addSubjectButton" class="primary-button">+ Add subject</button>
        </header>

        <section id="subjectsGrid" class="subjects-grid"></section>

        <section id="emptySubjects" class="empty-state hidden">
            <h2>No subjects yet.</h2>
            <p>Add your first subject and start building your study space.</p>
            <button class="primary-button" id="emptyAddSubjectButton">Add your first subject</button>
        </section>
    </main>

    <div class="modal hidden" id="subjectModal" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal></div>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <div>
                    <p class="section-kicker">NEW SUBJECT</p>
                    <h2 id="modalTitle">Add a subject</h2>
                </div>
                <button class="modal-close" id="closeSubjectModal" aria-label="Close">×</button>
            </div>

            <form id="subjectForm">
                <label>
                    Subject name
                    <input id="subjectNameInput" name="name" type="text" placeholder="e.g. Financial Accounting" required maxlength="60">
                </label>

                <label>
                    Short description <span class="optional">optional</span>
                    <textarea id="subjectDescriptionInput" name="description" placeholder="What are you studying in this subject?" maxlength="140"></textarea>
                </label>

                <div class="form-actions">
                    <button type="button" class="secondary-button" id="cancelSubjectButton">Cancel</button>
                    <button type="submit" class="primary-button">Create subject</button>
                </div>
            </form>
        </section>
    </div>

    <footer>
        <p>StudyOS</p>
    </footer>

    <script src="data/sample-data.js"></script>
    <script src="data/storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
