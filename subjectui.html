<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Subjects | StudyOS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app-enhancements.css"></head><body><nav class="navbar"><a href="dashboard.html" class="logo">Study<span>OS</span></a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="subjectui.html" class="active">Subjects</a><a href="#" class="disabled-link">Progress</a></div><div class="nav-actions"><button class="theme-toggle" id="themeToggle"><span id="themeIcon">☀</span></button><button class="profile-button" id="profileButton">—</button></div></nav><main class="container"><header class="page-header subjects-header"><div><p class="eyebrow">LEARNING</p><h1>Your subjects.</h1><p class="welcome-text">Create the subjects you actually study. Keep your material with them.</p></div><button id="addSubjectButton" class="primary-button">+ Add subject</button></header><section id="subjectsGrid" class="subjects-grid"></section><section id="emptySubjects" class="empty-state hidden"><h2>No subjects yet.</h2><p>Create your first subject and build your own study space.</p><button class="primary-button" id="emptyAddSubjectButton">Add your first subject</button></section></main><div class="modal hidden" id="subjectModal" aria-hidden="true"><div class="modal-backdrop" data-close-modal></div><section class="modal-card" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="section-kicker">NEW SUBJECT</p><h2>Add a subject</h2></div><button class="modal-close" id="closeSubjectModal">×</button></div><form id="subjectForm"><label>Subject name<input id="subjectNameInput" type="text" placeholder="e.g. Financial Accounting" required maxlength="60"></label><label>Short description <span class="optional">optional</span><textarea id="subjectDescriptionInput" placeholder="What are you studying?" maxlength="140"></textarea></label><div class="form-actions"><button type="button" class="secondary-button" id="cancelSubjectButton">Cancel</button><button type="submit" class="primary-button">Create subject</button></div></form></section></div><footer><p>StudyOS</p></footer><script src="data/storage.js"></script><script src="script.js"></script></body></html>
