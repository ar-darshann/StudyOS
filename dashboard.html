<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | StudyOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="dashboard.html" class="logo">Study<span>OS</span></a>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="subjectui.html">Subjects</a>
            <a href="#" class="disabled-link">Progress</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span id="themeIcon">☀</span>
            </button>
            <button class="profile-button" aria-label="Profile">SD</button>
        </div>
    </nav>

    <main class="container">
        <header class="dashboard-header">
            <div>
                <p class="eyebrow">DASHBOARD</p>
                <h1>Good morning.</h1>
                <p class="welcome-text">Here is where your studies stand today.</p>
            </div>
            <div class="today-date" id="todayDate"></div>
        </header>

        <section class="stats-grid" aria-label="Study statistics">
            <div class="stat-card"><span class="stat-label">Average score</span><strong id="dashboardAverage">—</strong></div>
            <div class="stat-card"><span class="stat-label">Study time</span><strong id="dashboardStudyTime">—</strong></div>
            <div class="stat-card"><span class="stat-label">Topics needing attention</span><strong id="dashboardWeakTopics">—</strong></div>
        </section>

        <section class="dashboard-grid">
            <article class="focus-panel">
                <div class="panel-heading">
                    <div><p class="section-kicker">NEXT UP</p><h2 id="focusSubject">—</h2></div>
                    <span class="score-chip" id="focusScore">—</span>
                </div>
                <p class="focus-topic" id="focusTopic">—</p>
                <div class="progress-track"><div class="progress-value" id="focusProgress"></div></div>
                <a href="#" id="focusLink" class="text-button">Continue studying <span>→</span></a>
            </article>

            <article class="subjects-panel">
                <div class="panel-heading">
                    <div><p class="section-kicker">YOUR SUBJECTS</p><h2>Keep moving.</h2></div>
                    <a href="subjectui.html" class="text-button">View all <span>→</span></a>
                </div>
                <div id="dashboardSubjects" class="dashboard-subject-list"></div>
            </article>
        </section>

        <section class="simple-section">
            <div class="section-heading-row"><div><p class="section-kicker">FOCUS AREAS</p><h2>Topics that need work</h2></div></div>
            <div id="dashboardTopics" class="attention-list"></div>
        </section>
    </main>

    <footer><p>StudyOS</p></footer>

    <script src="data/sample-data.js"></script>
    <script src="data/storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
